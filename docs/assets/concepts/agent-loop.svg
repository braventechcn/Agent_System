<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 360 190" role="img" aria-label="Agent loop">
<defs><pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#243963" stroke-width=".6"/></pattern><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3 0 6Z" fill="#9ab7ee"/></marker></defs>
<rect width="360" height="190" rx="16" fill="#101b38"/><rect width="360" height="190" rx="16" fill="url(#grid)" opacity=".45"/>
<text x="18" y="27" fill="#9ceaf4" font-size="11" font-family="ui-sans-serif,Arial,sans-serif" font-weight="800" letter-spacing="1.4">AGENT LOOP</text>
<rect x="10" y="65" width="92" height="64" rx="9" fill="#22545c" stroke="#5bc8b8" stroke-width="1.4"/><text x="56.0" y="94.0" text-anchor="middle" fill="#f6f9ff" font-family="ui-sans-serif,Arial,sans-serif" font-weight="700" font-size="11">Environment</text><text x="56.0" y="110.0" text-anchor="middle" fill="#b9c9e8" font-family="ui-sans-serif,Arial,sans-serif" font-size="9">current state</text><rect x="134" y="65" width="92" height="64" rx="9" fill="#443574" stroke="#ab8feb" stroke-width="1.4"/><text x="180.0" y="94.0" text-anchor="middle" fill="#f6f9ff" font-family="ui-sans-serif,Arial,sans-serif" font-weight="700" font-size="11">Agent</text><text x="180.0" y="110.0" text-anchor="middle" fill="#b9c9e8" font-family="ui-sans-serif,Arial,sans-serif" font-size="9">chooses action</text><rect x="258" y="65" width="92" height="64" rx="9" fill="#243d70" stroke="#729cf0" stroke-width="1.4"/><text x="304.0" y="94.0" text-anchor="middle" fill="#f6f9ff" font-family="ui-sans-serif,Arial,sans-serif" font-weight="700" font-size="11">Runtime</text><text x="304.0" y="110.0" text-anchor="middle" fill="#b9c9e8" font-family="ui-sans-serif,Arial,sans-serif" font-size="9">executes tool</text><path d="M102 88H130" fill="none" stroke="#9ab7ee" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="116" y="77" text-anchor="middle" fill="#9ceaf4" font-family="ui-sans-serif,Arial,sans-serif" font-size="9" font-weight="700">observe</text><path d="M226 88H254" fill="none" stroke="#9ab7ee" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="240" y="77" text-anchor="middle" fill="#9ceaf4" font-family="ui-sans-serif,Arial,sans-serif" font-size="9" font-weight="700">request</text><path d="M303 132V157Q303 166 292 166H58Q56 166 56 132" fill="none" stroke="#9ab7ee" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="180" y="183" text-anchor="middle" fill="#9ceaf4" font-family="ui-sans-serif,Arial,sans-serif" font-size="9" font-weight="700">execute → state changes → observe again</text>
