  <text x="78" y="166" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="800" letter-spacing="-2">Agent System</text>
  <text x="78" y="246" fill="url(#accent)" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="800" letter-spacing="-2">Learning Lab</text>
  <text x="82" y="300" fill="#c9d9ff" font-family="Arial, Helvetica, sans-serif" font-size="24">Observe  →  Decide  →  Act  →  Feedback</text>

