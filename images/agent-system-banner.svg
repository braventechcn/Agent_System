<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="360" viewBox="0 0 1400 360" role="img" aria-labelledby="title desc">
  <title id="title">Agent System Learning Lab</title>
  <desc id="desc">A bright agent icon beside the learning loop and a five-of-seven module progress indicator.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1737"/>
      <stop offset="0.55" stop-color="#17245b"/>
      <stop offset="1" stop-color="#371a64"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#63e8ff"/>
      <stop offset="0.55" stop-color="#9c9bff"/>
      <stop offset="1" stop-color="#ff8bd3"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#7088ff" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#7088ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#86a7ff" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1400" height="360" rx="28" fill="url(#background)"/>
